# Builds and tests on a GitHub-hosted Mac on every push, so changes can be checked without the developer's Mac.
name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash  # explicit bash = -eo pipefail, so a failing command piped into tee still fails the step

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version && swift --version

      # Tests and the app build both run even if one fails, so a single run reports everything.
      - name: Core tests (GrappleCore)
        id: tests
        continue-on-error: true
        working-directory: Packages/GrappleCore
        run: swift test 2>&1 | tee ../../core-tests.log

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen

      - name: Build app (iOS Simulator, unsigned)
        id: build
        continue-on-error: true
        run: |
          xcodebuild -project GrappleGuy.xcodeproj -scheme GrappleGuy \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee app-build.log > /dev/null
          grep -q "BUILD SUCCEEDED" app-build.log

      - name: Summary
        if: always()
        run: |
          echo "===== CORE TESTS: ${{ steps.tests.outcome }} ====="
          grep -E "error:|Executed [0-9]+ tests" core-tests.log | tail -40 || true
          echo "===== BOT DIAGNOSTICS ====="
          grep "DIAG" core-tests.log | head -260 || true
          echo "===== APP BUILD: ${{ steps.build.outcome }} ====="
          grep -E "error:|BUILD (SUCCEEDED|FAILED)" app-build.log | sort -u | head -60 || true
          if [[ "${{ steps.tests.outcome }}" != "success" || "${{ steps.build.outcome }}" != "success" ]]; then exit 1; fi

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: |
            core-tests.log
            app-build.log
          if-no-files-found: ignore
