name: GrappleGuy
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
packages:
  GrappleCore:
    path: Packages/GrappleCore
targets:
  GrappleGuy:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: GrappleCore
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Grapple Guy
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        CADisableMinimumFrameDurationOnPhone: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.grappleguy
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        # Set your Apple developer team here (or pick it in Xcode > Signing & Capabilities)
        DEVELOPMENT_TEAM: ""
